name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install development tools
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        run: npm run package

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install development tools
        run: npm ci --ignore-scripts
      - name: Install local browser and system libraries
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify synthetic dashboard states
        run: npm run test:ui
